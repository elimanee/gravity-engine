[package]
name        = "gravity_engine"
version     = "2.8.0"
edition     = "2021"
description = "A 2D physics sandbox: drop images, shapes and web buttons and watch them fly"
readme      = "README.md"
build       = "build.rs"

[[bin]]
name = "gravity_engine"
path = "src/main.rs"

[dependencies]
# Window + input + rendering
macroquad   = "0.4"
# Physics
rapier2d    = { version = "0.22", features = ["default"] }
# Image loading — default features already include png, jpeg, gif, webp, bmp,
# tiff, ico, tga, qoi, hdr, exr, pnm (ppm/pgm/pbm), dds, farbfeld, …
image       = { version = "0.25" }
# Animated GIF frame extraction
gif         = "0.13"
# Native file dialogs
rfd         = "0.15"
# Tracker module playback
openmpt     = "0.3"    # libopenmpt bindings (.mod / .xm / .it / .s3m / …)
cpal        = "0.15"   # cross-platform audio output
ringbuf     = "0.3"    # lock-free ring buffer for the decode→playback pipe
# Common audio playback (.mp3 / .flac / .wav / .ogg / …)
rodio       = { version = "0.19", features = ["symphonia-all"] }
# Song lengths (rodio 0.19 reports them wrongly); same version rodio uses
symphonia   = { version = "0.5", default-features = false }
# Synchronous HTTP for web fetchers and internet-radio streams
ureq        = "2"
# SVG rasteriser (includes usvg + tiny_skia as re-exports)
resvg       = "0.44"
# Settings + scene files
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
base64      = "0.22"
# Winamp / Audacious skins (.wsz archives)
zip         = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11  = { version = "2.21", features = ["xlib"] }
zbus = { version = "4", features = ["blocking"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level     = 3
lto           = "fat"   # whole-program link-time optimisation across all crates
codegen-units = 1       # single codegen unit maximises inlining across modules
panic         = "abort" # removes unwinding machinery (~5–10 % size reduction)
strip         = true    # strip debug symbols → smaller binary

# Dependencies are optimised even in dev builds: image decoding and the physics
# solver are unbearably slow at opt-level 0.
[profile.dev.package."*"]
opt-level = 2
