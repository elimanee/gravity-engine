name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libopenmpt-dev libasound2-dev libx11-dev libxi-dev \
            libgl1-mesa-dev libwayland-dev libxkbcommon-dev libgtk-3-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (web version)
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

      - name: Tests
        run: cargo test

      - name: Release build
        run: cargo build --release

      # Test builds of any branch, downloadable from the run's page.
      - uses: actions/upload-artifact@v4
        with:
          name: gravity_engine-linux-x86_64
          path: target/release/gravity_engine
          retention-days: 14

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-libopenmpt-x64-windows-v1

      - name: Install libopenmpt
        shell: pwsh
        run: .github/scripts/openmpt-windows.ps1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Release build
        run: cargo build --release

      - name: Package the test build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-build | Out-Null
          Copy-Item target\release\gravity_engine.exe test-build\
          Copy-Item "$env:OPENMPT_BIN_DIR\*.dll" test-build\

      - uses: actions/upload-artifact@v4
        with:
          name: gravity_engine-windows-x86_64
          path: test-build/*
          retention-days: 14
