name: Release

# Publishes a GitHub release with a Linux binary. Either push a tag
# (`git tag v2.0.0 && git push origin v2.0.0`) or run this workflow manually
# from the Actions tab with the tag to create. The release description is the
# matching section of CHANGELOG.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v2.0.0 (created on the selected branch if missing)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Extract release notes
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No section for $version in CHANGELOG.md"
            exit 1
          fi

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libopenmpt-dev libasound2-dev libx11-dev libxi-dev \
            libgl1-mesa-dev libwayland-dev libxkbcommon-dev libgtk-3-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir dist
          cp target/release/gravity_engine dist/gravity_engine-linux-x86_64
          cd dist && sha256sum gravity_engine-linux-x86_64 > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
